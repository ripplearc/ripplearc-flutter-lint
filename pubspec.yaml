name: ripplearc_linter
description: A custom lint library following best engineering practice 
version: 0.4.2
repository: https://github.com/ripplearc/ripplearc-flutter-lint

environment:
  sdk: '>=3.7.2 <4.0.0'

executables:
  standalone_checker: standalone_checker

dependencies:
  custom_lint_builder: ^0.8.1
  analyzer: ^14.0.0
  analyzer_plugin: ^0.13.0
  source_span: ^1.10.1
  path: ^1.9.1
  yaml: ^3.1.3    

dev_dependencies:
  test: ^1.26.2
  pubspec_parse: ^1.2.3  # Use the latest version available 